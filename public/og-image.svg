<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#001a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Hexagon Logo -->
  <path d="M 200 215 L 280 165 L 360 215 L 360 315 L 280 365 L 200 315 Z" 
        stroke="url(#textGradient)" stroke-width="4" fill="none" filter="url(#glow)"/>
  
  <!-- Stylized A -->
  <path d="M 240 265 L 260 265 L 280 315 L 300 265 L 320 265 L 280 355 L 240 265 Z" 
        fill="url(#textGradient)" filter="url(#glow)"/>
  <line x1="250" y1="290" x2="310" y2="290" 
        stroke="url(#textGradient)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Main Text -->
  <text x="450" y="280" font-family="'Electrolize', sans-serif" font-size="120" font-weight="bold" 
        fill="url(#textGradient)" filter="url(#glow)">AeThex</text>
  
  <!-- Tagline -->
  <text x="450" y="350" font-family="'Source Code Pro', monospace" font-size="32" 
        fill="#00ffff" opacity="0.8" letter-spacing="2">ONE IDENTITY. INFINITE WORLDS.</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="3" fill="#00ffff" filter="url(#glow)"/>
  <circle cx="1100" cy="530" r="3" fill="#ff00ff" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="2" fill="#00ffff" filter="url(#glow)"/>
  <circle cx="1050" cy="150" r="2" fill="#ff00ff" filter="url(#glow)"/>
</svg>
